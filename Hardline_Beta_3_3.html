function jetSpecial(v,I,who,tm,pl){const w=v.D.w3;if(w=='msl'){v.mlc=.8;v.ms--;launchMissile(v,I,who,tm)}else if(w=='salvo'){if(v.ms<3)return;let n=0;for(let q=-1;q<=1;q++){const mm=launchMissile(v,I,who,tm);if(mm){n++;mm.vel.x+=Math.cos(v.yaw)*q*12;mm.vel.z-=Math.sin(v.yaw)*q*12;mm.life=6}}if(n){v.ms-=3;v.mlc=1.1}}else if(w=='strike'){const mm=launchMissile(v,I,who,tm);if(mm){mm.vel.multiplyScalar(1.15);mm.life=9;mm.big=2.4;mm.scale.setScalar(1.7);v.ms--;v.mlc=1.5}}else if(w=='carpet'){if(v.y>3&&!v.cbn){v.ms--;v.cbn=10;v.cbt=0;v.mlc=1}}else if(w=='bb'){if(v.y>3){v.ms--;v.mlc=1;dropBomb(v,who,{kd:'bb',k:1.6})}}else if(w=='pods'){v.mlc=.11;v.ms--;podRocket(v,I,who,tm,pl)}}

const BP=[],DC=[],bgm=new THREE.SphereGeometry(.05,5,4),bm=[0x7a0c0c,0xa31515,0x5c0808].map(c=>new THREE.MeshBasicMaterial({color:c})),dgm=new THREE.CircleGeometry(1,9);
function blood(x,y,z,dx,dz,n,big){const L=Math.hypot(dx,dz)||1;dx/=L;dz/=L;const k=big?.4:1;for(let i=0;i<n;i++){if(BP.length>400)break;const m=new THREE.Mesh(bgm,bm[i%3]),a=Math.random()*6.28,r=Math.random()*(big?3:1.8);m.position.set(x,y,z);m.scale.setScalar(.6+Math.random()*(big?1.6:1));m.v=[dx*(2+Math.random()*4)*k+Math.cos(a)*r,1+Math.random()*(big?5:3.5),dz*(2+Math.random()*4)*k+Math.sin(a)*r];sc.add(m);BP.push(m)}}
function splat(x,z,s){if(DC.length>90){const o=DC.shift();sc.remove(o);o.material.dispose()}const d=new THREE.Mesh(dgm,new THREE.MeshBasicMaterial({color:0x6a0a0a,transparent:true,opacity:.75,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3}));d.rotation.x=-Math.PI/2;d.position.set(x,.28,z);d.scale.setScalar(.12+Math.random()*.3*s);d.life=14;sc.add(d);DC.push(d)}

function findLock(o,d,tm,airOnly,cone,rng){let tg=null,ba=cone;for(const w of VS){if(w.dead||w.tm<0||w.tm===tm||!(w.bot||P.veh===w))continue;if(airOnly&&!isAir(w))continue;const dx=w.x-o.x,dy=w.y+1.3-o.y,dz=w.z-o.z,L=Math.hypot(dx,dy,dz);if(L<25||L>(w.D.st?Math.min(rng,260):rng))continue;const a=Math.acos(clamp((dx*d.x+dy*d.y+dz*d.z)/L,-1,1));if(a<ba){ba=a;tg=w}}return tg}
function aaLock(V){const zs=V.D.s,o=new THREE.Vector3(V.x-Math.sin(V.wy)*4.6*zs,V.y+2.2*zs,V.z-Math.cos(V.wy)*4.6*zs),d=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);return findLock(o,d,V.tm,true,.5,500)}

 const tg=tk===2?null:findLock(o,d,tm,tk===1,tk===1?.5:.32,500);if(tk===1&&!tg)return false;
 const m=new THREE.Mesh(mslG,mslM);m.position.copy(o);m.vel=d.clone().multiplyScalar(Math.max(v.sp,60)+80);m.tg=tg;m.life=7;m.tm=tm;m.by=who;m.tp=0;m.lookAt(o.clone().add(d));sc.add(m);MSL.push(m);sfx(110,.5,.35,'sawtooth');if(tg&&tg===P.veh&&tm!==P.team){sfx(650,.5,.4,'sawtooth');mwt=0}return m}
function mslBoom(m){const p=m.position,G=m.big||1,R=11*(G>1?1.5:1),R2=10*(G>1?1.5:1);puff(p.x,p.y,p.z,7*(G>1?1.6:1));puff(p.x,p.y+.5,p.z,4);sfxa(p.x,p.z,70,.8,.6,'sawtooth');for(const e of ALL)if(e.alive&&!e.inV&&e.team!==m.tm){const d=Math.hypot(e.x-p.x,e.z-p.z);if(d<R&&Math.abs(e.y-p.y)<7)dmg(e,(200*(1-d/R)+25)*G,m.by,'Missile')}for(const w of VS)if(!w.dead&&w.tm!==m.tm&&w.tm>=0){const d=Math.hypot(w.x-p.x,w.y+1.3-p.y,w.z-p.z);if(d<R2)vhitv(w,(w.type=='tank'?130:200)*(1-d/(R2*2))*G,m.by)}}
function mupd(dt){for(let i=MSL.length;i--;){const m=MSL[i];m.life-=dt;const sp=m.vel.length();
  if(m.tg&&m.tg.dead){m.tg=(m.og&&!m.og.dead&&Math.hypot(m.og.x-m.position.x,m.og.y-m.position.y,m.og.z-m.position.z)<260)?m.og:null;m.og=null}
  if(m.tg){const want=new THREE.Vector3(m.tg.x,m.tg.y+1.3,m.tg.z).sub(m.position).normalize(),cur=m.vel.clone().normalize().lerp(want,Math.min(1,dt*2.4)).normalize();m.vel.copy(cur.multiplyScalar(sp))}
  m.position.addScaledVector(m.vel,dt);m.lookAt(m.position.clone().add(m.vel));
  m.tp-=dt;if(m.tp<=0){m.tp=.09;puff(m.position.x,m.position.y,m.position.z,.7)}
  let hit=m.life<=0||m.position.y<=.3;if(!hit&&m.tg&&m.tg.fl&&Math.hypot(m.tg.x-m.position.x,m.tg.y-m.position.y,m.tg.z-m.position.z)<5)hit=true;
  if(!hit)for(const q of BX)if(m.position.x>q.x0&&m.position.x<q.x1&&m.position.z>q.z0&&m.position.z<q.z1&&m.position.y<=q.y1){hit=true;break}
  if(!hit)for(const w of VS){if(w.dead||w.tm===m.tm||w.tm<0||!(w.bot||P.veh===w))continue;if(Math.hypot(w.x-m.position.x,w.y+1.3-m.position.y,w.z-m.position.z)<w.r+2.5){hit=true;break}}
  if(hit){mslBoom(m);sc.remove(m);MSL.splice(i,1)}}}
